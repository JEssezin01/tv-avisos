<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mural TV</title>
    <link rel="stylesheet" href="/css/tv.css" />
  </head>
  <body>
    <div class="stage layout-horizontal" id="stage">
      <p class="aviso" id="aviso">Conectando&hellip;</p>
      <video
        class="media"
        id="mediaVideo"
        muted
        loop
        playsinline
        autoplay
        preload="auto"
        hidden
      ></video>
      <img class="media" id="mediaImage" alt="" hidden />

      <!-- Marca Oliva Ratio: retangulo aureo com sua divisao (1:phi) e o
           arco da espiral. Discreto, canto inferior. -->
      <div class="brand-tv" aria-hidden="true">
        <svg viewBox="0 0 21 13" fill="none" stroke="currentColor"
             stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="0.5" y="0.5" width="20" height="12" rx="1.3" />
          <path d="M13 0.5 V12.5" />
          <path d="M13 0.5 A 12 12 0 0 0 1 12.5" />
        </svg>
        <span class="wm">Oliva Ratio</span>
      </div>
    </div>

    <button class="fs-btn" id="fsBtn" type="button">Tela cheia</button>
    <span class="status" id="status" data-state="connecting" title="conexao">&bull;</span>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/tv.js"></script>
  </body>
</html>
